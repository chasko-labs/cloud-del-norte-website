<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon-star.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Workshop Dashboard | quantum.clouddelnorte.org</title>
    <meta name="description" content="Quantum computing workshop dashboard — join live sessions, view recordings, manage workshops." />
    <!-- cdn-theme-fouc-guard: critical-path theme apply (must run before React hydrates). -->
    <script>
      (() => {
        var t;
        try {
          t = localStorage.getItem('awsaerospace-theme');
        } catch (_e) { /* localStorage unavailable; safe fall-through */ }
        if (t !== 'dark' && t !== 'light') {
          t = window.matchMedia?.('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        if (t === 'dark') {
          document.documentElement.classList.add('awsui-dark-mode');
          document.documentElement.style.colorScheme = 'dark';
        } else {
          document.documentElement.style.colorScheme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
